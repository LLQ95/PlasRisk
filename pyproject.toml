[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasrisk"
version = "1.4.0"
description = "Data-driven weighted risk assessment for bacterial plasmids (lite/full/ordinal modes)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PlasRisk Team"},
]
keywords = [
    "plasmid",
    "antimicrobial resistance",
    "risk assessment",
    "bioinformatics",
    "One Health",
    "virulence factors",
    "mobile genetic elements",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
]

[project.optional-dependencies]
full = [
    "abricate",
]
test = [
    "pytest>=7.0",
]

[project.scripts]
plasrisk = "plasrisk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plasrisk*"]

[tool.setuptools.package-data]
plasrisk = ["data/*.csv", "data/*.tsv", "data/*.txt"]
