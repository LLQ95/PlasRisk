[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasrisk"
version = "1.6.0"
description = "PlasRisk: plasmid risk assessment for One Health surveillance, with metagenomic and raw-assembly (WGS/long-read) front ends"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "PlasRisk Team"},
]
keywords = [
    "plasmid",
    "antimicrobial resistance",
    "virulence",
    "one health",
    "risk assessment",
    "metagenomics",
    "bioinformatics",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=1.3",
]

[project.optional-dependencies]
abricate = []
full = [
    "numpy>=1.20",
]
dev = [
    "pytest>=6.0",
]

[project.scripts]
plasrisk = "plasrisk.cli:main"
plasrisk-fragment-sim = "plasrisk.fragment_sim:main"

[project.urls]
Homepage = "https://github.com/LLQ95/PlasRisk"
Repository = "https://github.com/LLQ95/PlasRisk"
Issues = "https://github.com/LLQ95/PlasRisk/issues"

[tool.setuptools]
packages = ["plasrisk"]

[tool.setuptools.package-data]
plasrisk = ["data/*.tsv", "data/*.csv", "data/*.txt"]
